  <link rel="canonical" href="https://ricardomejiastravieso.com/" />

  <!-- OG tags support-->
  <meta name="og:site_name" content="Ricardo Mejías Travieso">
  <meta name="og:title" content="Ricardo Mejías Travieso | Full Stack & Mobile Developer">
  <meta name="og:description"
    content="Ricardo Mejías Travieso, software developer orientado a tecnologías web y de dispositivos móbiles en La Línea de la Concepción, Cádiz.">
  <meta name="og:type" content="website">
  <meta name="og:url" content="https://ricardomejiastravieso.com/">
  <meta property="og:image" content="https://ricardomejiastravieso.com/profile.png" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ricardo Mejías Travieso">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ricardo Mejías Travieso | Full Stack & Mobile Developer</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #333333;
      height: 100vh;
      width: 100vw;
      margin: 0px;
      padding: 0px;
      /* overflow: hidden; */
    }

    #personalparent {
      background-color: #333333;
      position: absolute;
      z-index: 1;
      margin: 0px;
      padding: 0px;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      inset: 0px;
      transition: opacity .8s ease-out;
    }

    #personalparent.personalfadeout {
      opacity: 0;
      pointer-events: none;
    }

    #personalsplashicon {
      inset: 0px;
      opacity: 1;
      animation: splashFadeMe 1.5s ease;
      -webkit-animation: splashFadeMe 1.5s ease;
    }

    #personalparent.personalfadeout #personalsplashicon {
      transform: scale(1.5);
      opacity: 0;
      animation: splashFadeOutMe .6s ease;
      -webkit-animation: splashFadeOutMe .6s ease;
    }

    @keyframes splashFadeMe {
      0% {
        opacity: 0;
        transform: scale(0.8);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @-webkit-keyframes splashFadeMe {
      0% {
        -webkit-opacity: 0;
        -webkit-transform: scale(0.8);
      }
      100% {
        -webkit-opacity: 1;
        -webkit-transform: scale(1);
      }
    }
    
    @keyframes splashFadeOutMe {
      0% {
        opacity: 1;
        transform: scale(1);
      }

      100% {
        opacity: 0;
        transform: scale(1.5);
      }
    }

    @-webkit-keyframes splashFadeOutMe {
      0% {
        -webkit-opacity: 1;
        -webkit-transform: scale(1);
      }
      100% {
        -webkit-opacity: 0;
        -webkit-transform: scale(1.5);
      }
    }
  </style>
</head>
<body>
  <div id="personalparent">
    <img id="personalsplashicon" src="icons/Icon-192.png" style="width: 180px; height: 180px;" aria-hidden="true"
      alt="Ricardo Mejias Travieso logo" title="Ricardo Mejías Travieso | Full Stack & Mobile Developer">
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
